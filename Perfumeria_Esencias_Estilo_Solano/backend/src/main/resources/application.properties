spring.application.name=perfumeria-api
server.address=127.0.0.1
server.port=${PS_HTTP_PORT:8095}
server.servlet.session.timeout=20m
server.servlet.session.cookie.name=PSSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${PS_DB_URL}
spring.datasource.username=${PS_DB_USER}
spring.datasource.password=${PS_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
spring.jackson.deserialization.use-big-decimal-for-floats=true
spring.jackson.generator.write-bigdecimal-as-plain=true
ps.bootstrap.password=${PS_BOOTSTRAP_PASSWORD:}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
