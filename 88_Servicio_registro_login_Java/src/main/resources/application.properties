spring.application.name=pos-auth-caso
server.address=127.0.0.1
server.port=${APP_PORT:8088}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:33117/sena_pos_ga7_auth?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USER:sena_auth}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.connection-timeout=5000
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.sql.init.mode=never
