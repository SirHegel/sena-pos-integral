spring.application.name=pos-catalogo-spring
server.address=127.0.0.1
server.port=${APP_PORT:8083}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:33117/sena_pos_ga7_auth?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:sena_catalogo}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
