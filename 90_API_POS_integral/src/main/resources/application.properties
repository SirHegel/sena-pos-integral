spring.application.name=pos-integral-api
server.address=127.0.0.1
server.port=${POS_HTTP_PORT:8090}
server.servlet.session.timeout=20m
server.servlet.session.cookie.name=POSSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${POS_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${POS_DB_URL}
spring.datasource.username=${POS_DB_USER}
spring.datasource.password=${POS_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
pos.demo.enabled=${POS_DEMO_ENABLED:false}
pos.demo.password=${POS_DEMO_PASSWORD:}
logging.level.org.springframework.jdbc.core=INFO
